<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - RecruitFlow</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: var(--bg-page-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="auth-card" style="width: 100%; max-width: 440px;">
    <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;">
        <div class="brand-logo-icon" style="width: 38px; height: 38px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <span style="font-size: 1.4rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.3px;">RecruitFlow</span>
      </div>
      <h1 class="auth-title">Sign In to Your Workspace</h1>
      <p class="auth-subtitle">Access your AI-powered candidate pipeline</p>
    </div>

    {% if form.errors %}
      <div style="padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 6px; color: #f87171; font-size: 0.85rem; margin-bottom: 1.5rem;">
        Invalid email or password. Please try again.
      </div>
    {% endif %}

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        {{ form.email }}
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-input-wrapper" style="position: relative; display: flex; align-items: center; width: 100%;">
          {{ form.password }}
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; padding: 0.25rem;">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed" style="display: none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="23" x2="23" y2="1"></line>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
      <div class="auth-footer" style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
        Don't have an account? <a href="{% url 'accounts:register' %}" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </div>
    </form>
  </div>

  <script>
    document.querySelectorAll('.password-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const wrapper = btn.closest('.password-input-wrapper');
        const input = wrapper.querySelector('input');
        const eyeOpen = btn.querySelector('.eye-open');
        const eyeClosed = btn.querySelector('.eye-closed');
        if (input.type === 'password') {
          input.type = 'text';
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
          btn.style.color = '#38bdf8';
        } else {
          input.type = 'password';
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
          btn.style.color = '#94a3b8';
        }
      });
    });
  </script>
</body>
</html>
