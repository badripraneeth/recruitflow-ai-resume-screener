<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - RecruitFlow</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background: var(--bg-page-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
  <div class="auth-card" style="width: 100%; max-width: 440px;">
    <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;">
        <div class="brand-logo-icon" style="width: 38px; height: 38px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <span style="font-size: 1.4rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.3px;">RecruitFlow</span>
      </div>
      <h1 class="auth-title">Sign In to Your Workspace</h1>
      <p class="auth-subtitle">Access your AI-powered candidate pipeline</p>
    </div>

    {% if form.errors %}
      <div style="padding: 0.75rem 1rem; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 6px; color: #f87171; font-size: 0.85rem; margin-bottom: 1.5rem;">
        Invalid email or password. Please try again.
      </div>
    {% endif %}

    <form method="POST" class="auth-form">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email Address</label>
        {{ form.email }}
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
      <div class="auth-footer" style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
        Don't have an account? <a href="{% url 'accounts:register' %}" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </div>
    </form>
  </div>
</body>
</html>
